<div class="page-wrap">
  <!-- Layered void background -->
  <div class="void-bg" aria-hidden="true"></div>
  <div class="mist-layer" aria-hidden="true"></div>

  <!-- Floating soul particles -->
  <div class="particles" aria-hidden="true">
    @for (p of particles; track $index) {
      <span class="particle" [class.falls]="p.falling" [style]="vars(p)"></span>
    }
  </div>

  <main class="content">
    <!-- ─── The pinned region ───────────────────────────────────────────────
         A grid row that does not scroll, rather than a sticky element inside
         the scroller. Every control the page offers lives here, so none of
         them can be scrolled out of reach. -->
    <section class="pinned" aria-label="Your decks">
      <header class="screen-header">
        <span class="screen-header-rule" aria-hidden="true"></span>
        <h1 class="screen-header-title">Cards</h1>
        <span class="screen-header-rule is-end" aria-hidden="true"></span>
      </header>

      <app-deck-bar
        [decks]="decks()"
        [selectedIndex]="selectedDeck()"
        [openPosition]="openDeckPosition()"
        (selectDeck)="onSelectDeck($event)"
        (createDeck)="onCreateDeck()"
        (deleteDeck)="onDeleteDeck($event)"
        (selectCard)="onSelectDeckCard($event)"
        (removeCard)="onRemoveFromDeck($event)"
        (readCard)="onRead('deck', $event)"
        (dismissMenu)="dismissMenu()"
      />

      <div class="sort-row">
        <div class="sort-group">
          <div class="sort-options" role="group" aria-label="Order by">
            @for (order of sorts; track order.key) {
              @let active = sort().key === order.key;
              <button
                type="button"
                class="sort-option"
                [class.is-active]="active"
                [attr.aria-pressed]="active"
                (click)="onSort(order.key)"
              >
                {{ order.label }}
                @if (active) {
                  <!-- The direction in effect, drawn on the active order only:
                       down for descending, turned up for ascending. The words
                       beside it carry the same fact to assistive technology. -->
                  <svg
                    class="sort-chevron"
                    [class.is-asc]="sort().direction === 'asc'"
                    viewBox="0 0 10 10"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M2 3.75 5 6.75 8 3.75" />
                  </svg>
                  <span class="sr-only">{{
                    sort().direction === 'asc' ? ', ascending' : ', descending'
                  }}</span>
                }
              </button>
            }
          </div>
        </div>

        <!-- A testing aid, present in every build. Its dashed border and chip
             mark it as tooling rather than part of the game, and it sits at
             the row's far end, away from the deck controls. -->
        <button type="button" class="reset-data" (click)="askToReset()">
          <span class="debug-chip" aria-hidden="true">Debug</span>
          Reset data
        </button>
      </div>
    </section>

    <!-- ─── The scrolling collection ────────────────────────────────────── -->
    <app-collection-grid
      class="collection-region"
      [sections]="sections()"
      [generation]="sortGeneration()"
      [deckName]="selectedDeckName()"
      [openIndex]="openCollectionIndex()"
      [addLabel]="addLabel()"
      (selectCard)="onSelectCollectionCard($event)"
      (addCard)="onAddToDeck($event)"
      (readCard)="onRead('collection', $event)"
      (dismissMenu)="dismissMenu()"
    />
  </main>
</div>

@if (readingCard(); as card) {
  <app-card-reader
    [card]="card"
    [actionLabel]="readingFromDeck() ? 'Remove' : addLabel()"
    [actionAvailable]="readingFromDeck() || readingAddReason() === ''"
    [actionReason]="readingFromDeck() ? '' : readingAddReason()"
    (action)="onReaderAction()"
    (close)="closeReader()"
  />
}

@if (confirmingReset()) {
  <app-confirm-dialog
    message="Reset all data? Your cards, Geo, and decks will be replaced with a new player's."
    confirmLabel="Reset data"
    cancelLabel="Cancel"
    (confirm)="onReset()"
    (cancel)="confirmingReset.set(false)"
  />
}
