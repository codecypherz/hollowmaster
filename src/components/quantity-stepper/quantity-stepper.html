@let whyNotLower = canLower() ? '' : lowerReason();
@let whyNotRaise = canRaise() ? '' : raiseReason();

<button
  type="button"
  class="hk-btn sm lower"
  [attr.aria-label]="lowerLabel()"
  [attr.aria-disabled]="canLower() ? null : 'true'"
  [attr.aria-describedby]="whyNotLower ? id + '-lower' : null"
  [attr.title]="whyNotLower || null"
  (click)="onLower()"
>
  <span class="glyph">&minus;</span>
</button>
<input
  #field
  type="text"
  inputmode="numeric"
  autocomplete="off"
  class="hk-seg-field value"
  [value]="text()"
  [readOnly]="!editable()"
  [attr.aria-label]="fieldLabel()"
  [attr.aria-disabled]="editable() ? null : 'true'"
  [attr.aria-describedby]="!editable() && whyNotRaise ? id + '-raise' : null"
  [attr.title]="(!editable() && whyNotRaise) || null"
  (input)="onInput()"
  (mousedown)="onFieldPress($event)"
  (blur)="onBlur()"
  (keydown.enter)="onEnter()"
  (keydown.escape)="onEscape($event)"
/>
<button
  type="button"
  class="hk-btn sm raise"
  [attr.aria-label]="raiseLabel()"
  [attr.aria-disabled]="canRaise() ? null : 'true'"
  [attr.aria-describedby]="whyNotRaise ? id + '-raise' : null"
  [attr.title]="whyNotRaise || null"
  (click)="onRaise()"
>
  <span class="glyph">+</span>
</button>
<ng-content />

<!-- `hidden` still describes: these are read with their control and nowhere else. -->
@if (whyNotLower) {
  <span hidden [id]="id + '-lower'">{{ whyNotLower }}</span>
}
@if (whyNotRaise) {
  <span hidden [id]="id + '-raise'">{{ whyNotRaise }}</span>
}
