<!-- The chevron ring and the four sections are one 3×3 grid: the eight compass
     positions surround a centre `face` area. Splitting them would put the grid
     in the caller and half its children here. -->
<ng-template #frame>
  @for (dir of directions; track dir) {
    <span class="arr" [class]="'arr-' + dir.toLowerCase()" [class.arr-on]="hasArrow(dir)"></span>
  }

  <span class="face">
    <span class="cf-name">
      <span class="owner-pip" aria-hidden="true"></span>
      <span class="cf-name-text">{{ card()!.name }}</span>
    </span>

    <span class="cf-img" [style.background-image]="imageStyle()">
      <!-- Five slots always, so the ceiling reads without a legend. The sixth
           star sits outside the plaque: beyond the scale, not one more of it. -->
      <span class="cf-stars" aria-hidden="true">
        <span class="star-plaque">
          @for (lit of starSlots(); track $index) {
            <span class="star" [class.lit]="lit"></span>
          }
        </span>
        @if (showSixth()) {
          <span class="star-six"></span>
        }
      </span>
    </span>

    <!-- Each bar is a label cap plus a track. The fill is a percentage of the
         track alone, so no value can put fill underneath the label. -->
    <span class="cf-stats" aria-hidden="true">
      <span class="stat-bar">
        <span class="stat-cap">AT</span>
        <span class="stat-track">
          <span class="stat-fill atk-fill" [style.width.%]="card()!.attack"></span>
        </span>
      </span>
      <span class="stat-bar">
        <span class="stat-cap">DE</span>
        <span class="stat-track">
          <span class="stat-fill def-fill" [style.width.%]="card()!.defense"></span>
        </span>
      </span>
    </span>

    <!-- Always in the DOM. Below the width gate it is visually hidden rather
         than removed, so the text stays reachable and `aria-describedby`
         keeps resolving. -->
    <span class="cf-ability">
      <!-- Both floats come before the text so the text flows around them. The
           sink reserves the box's full height less the plate's, so the plate
           that clears it settles into the bottom-right corner instead of
           claiming a row of its own, and the text wraps around it. -->
      <span class="cf-sink" aria-hidden="true"></span>
      <span class="cf-plate">
        <span class="cf-set">{{ card()!.set }}</span>
        <span class="cf-number">{{ setNumber() }}</span>
      </span>
      <span class="cf-ability-text" [id]="abilityId">{{ card()!.ability }}</span>
    </span>
  </span>
</ng-template>

@if (faceDown()) {
  <!-- Reveals nothing: no name, art, rarity, stats, chevrons, ability, or set. -->
  <span class="frame back" aria-hidden="true">
    <span class="back-pattern"></span>
    <span class="back-seal"></span>
  </span>
} @else if (card()) {
  @if (selectable()) {
    <button
      type="button"
      class="frame"
      [attr.aria-label]="description()"
      [attr.aria-describedby]="abilityId"
      [attr.aria-pressed]="selected()"
      (click)="onActivate()"
    >
      <ng-container [ngTemplateOutlet]="frame" />
    </button>
  } @else {
    <span class="frame" [attr.aria-describedby]="abilityId">
      <ng-container [ngTemplateOutlet]="frame" />
      <span class="sr-only">{{ description() }}</span>
    </span>
  }
}
